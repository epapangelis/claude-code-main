<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ιστορικό Service - Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6500;
            --primary-light: #FFF0E5;
            --primary-dark: #CC5200;
            --bg-base: #E5E7EB;
            --bg-paper: #FFFFFF;
            --bg-surface: #F9FAFB;
            --bg-surface-dark: #F3F4F6;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-light: #E5E7EB;
            --border-dark: #D1D5DB;
            --font-main: "Geologica", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: var(--font-main);
            background: var(--bg-base);
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .service-banner {
            position: relative;
            width: 100%;
            max-width: 820px;
            background-color: var(--bg-paper);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* --- hero section, mirrors vehicle-service-history.html --- */
        .banner-hero {
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 32px;
        }

        /* document graphic */
        .doc-graphic {
            flex-shrink: 0;
            width: 128px;
            height: 148px;
            position: relative;
        }

        .doc-sheet {
            position: absolute;
            width: 100px;
            height: 132px;
            background: var(--bg-paper);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 10px 20px -8px rgba(17, 24, 39, 0.12);
        }

        .doc-sheet.back {
            top: 16px;
            left: 24px;
            transform: rotate(8deg);
            background: var(--bg-surface-dark);
            z-index: 1;
        }

        .doc-sheet.front {
            top: 4px;
            left: 4px;
            z-index: 2;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .doc-sheet.front .doc-line {
            height: 6px;
            border-radius: 3px;
            background: var(--bg-surface-dark);
        }

        .doc-sheet.front .doc-line.w60 {
            width: 60%;
        }

        .doc-sheet.front .doc-line.w80 {
            width: 80%;
        }

        .doc-sheet.front .doc-line.w40 {
            width: 40%;
        }

        .doc-sheet.front .doc-line.accent {
            background: var(--primary);
            opacity: 0.35;
        }

        .doc-badge {
            position: absolute;
            bottom: -8px;
            right: -10px;
            z-index: 3;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px -4px rgba(255, 101, 0, 0.5);
            border: 3px solid var(--bg-paper);
        }

        /* copy + CTA */
        .banner-copy {
            flex: 1;
            min-width: 0;
        }

        .banner-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.25;
            margin: 0 0 8px;
        }

        .banner-title span {
            color: var(--primary);
        }

        .banner-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 20px;
            max-width: 420px;
        }

        .banner-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .banner-download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 9999px;
            padding: 14px 26px;
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 10px 20px -6px rgba(255, 101, 0, 0.45);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .banner-download-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -6px rgba(255, 101, 0, 0.55);
        }

        .banner-filesize {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .banner-filesize svg {
            color: var(--primary);
        }

        @media screen and (max-width: 680px) {
            body {
                padding: 0;
            }

            .service-banner {
                border-radius: 0;
            }

            .banner-hero {
                flex-direction: column;
                text-align: center;
                padding: 28px 20px;
            }

            .banner-subtitle {
                max-width: none;
            }

            .banner-actions {
                flex-direction: column;
                width: 100%;
            }

            .banner-download-btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media screen and (max-width: 400px) {
            .banner-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="service-banner">

        <div class="banner-hero">
            <div class="doc-graphic">
                <div class="doc-sheet back"></div>
                <div class="doc-sheet front">
                    <div class="doc-line w60"></div>
                    <div class="doc-line w80"></div>
                    <div class="doc-line w40 accent"></div>
                    <div class="doc-line w80"></div>
                    <div class="doc-line w60"></div>
                    <div class="doc-line w40 accent"></div>
                </div>
                <div class="doc-badge">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>

            <div class="banner-copy">
                <h2 class="banner-title">Δες το <span>πλήρες ιστορικό</span><br>service αυτού του οχήματος</h2>
                <p class="banner-subtitle">Κατέβασε το επίσημο αρχείο με όλες τις καταγεγραμμένες εργασίες συντήρησης, ημερομηνίες και χιλιόμετρα.</p>
                <div class="banner-actions">
                    <button class="banner-download-btn" type="button">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Λήψη Ιστορικού
                    </button>
                    <span class="banner-filesize">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        PDF
                    </span>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
